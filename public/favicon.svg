<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="232" fill="url(#glow)"/>

  <!-- Body/shoulders hint -->
  <path d="M185 340 Q200 410 256 420 Q312 410 327 340" fill="#f472b6" opacity="0.7"/>
  <path d="M170 345 Q256 440 342 345 L320 370 Q256 410 192 370 Z" fill="#ec4899" opacity="0.6"/>

  <!-- Neck -->
  <rect x="241" y="245" width="30" height="35" rx="6" fill="#fcdbb6"/>

  <!-- Long hair back (flowing down) -->
  <path d="M155 210 Q130 280 140 400 Q150 370 165 320 Q170 260 170 220 Z" fill="#1e1b4b"/>
  <path d="M357 210 Q382 280 372 400 Q362 370 347 320 Q342 260 342 220 Z" fill="#1e1b4b"/>
