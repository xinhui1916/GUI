  <circle cx="145" cy="130" r="4" fill="white" opacity="0.5"/>
  <circle cx="138" cy="115" r="2" fill="white" opacity="0.3"/>
  <circle cx="155" cy="108" r="1.5" fill="white" opacity="0.4"/>

  <circle cx="375" cy="140" r="3.5" fill="white" opacity="0.5"/>
  <circle cx="368" cy="120" r="2" fill="white" opacity="0.3"/>
  <circle cx="385" cy="128" r="1.5" fill="white" opacity="0.4"/>

  <circle cx="130" cy="320" r="2" fill="white" opacity="0.3"/>
  <circle cx="385" cy="300" r="2.5" fill="white" opacity="0.3"/>
</svg>
