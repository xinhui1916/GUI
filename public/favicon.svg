  <path d="M158 215 Q135 285 145 390 Q155 360 168 315 Q172 258 172 222 Z" fill="#312e81"/>
  <path d="M354 215 Q377 285 367 390 Q357 360 344 315 Q340 258 340 222 Z" fill="#312e81"/>

