  <path d="M205 168 Q230 150 256 162 Q230 158 205 168 Z" fill="#db2777"/>
  <path d="M307 168 Q282 150 256 162 Q282 158 307 168 Z" fill="#db2777"/>
  <circle cx="256" cy="163" r="6" fill="#ec4899"/>

  <!-- Eyes - Left -->
  <ellipse cx="222" cy="240" rx="19" ry="21" fill="#1e1b4b"/>
  <ellipse cx="222" cy="237" rx="15" ry="15" fill="#312e81"/>
  <ellipse cx="220" cy="233" rx="11" ry="11" fill="#4338ca"/>
  <ellipse cx="218" cy="229" rx="7" ry="8" fill="#1e1b4b"/>
  <!-- Eye highlights -->
  <ellipse cx="213" cy="224" rx="5" ry="4" fill="white" opacity="0.9"/>
  <circle cx="228" cy="237" r="3" fill="white" opacity="0.5"/>
  <ellipse cx="216" cy="217" rx="2" ry="1.5" fill="white" opacity="0.3"/>

  <!-- Eyes - Right -->
  <ellipse cx="290" cy="240" rx="19" ry="21" fill="#1e1b4b"/>
  <ellipse cx="290" cy="237" rx="15" ry="15" fill="#312e81"/>
  <ellipse cx="288" cy="233" rx="11" ry="11" fill="#4338ca"/>
  <ellipse cx="286" cy="229" rx="7" ry="8" fill="#1e1b4b"/>
  <!-- Eye highlights -->
  <ellipse cx="281" cy="224" rx="5" ry="4" fill="white" opacity="0.9"/>
  <circle cx="296" cy="237" r="3" fill="white" opacity="0.5"/>
  <ellipse cx="284" cy="217" rx="2" ry="1.5" fill="white" opacity="0.3"/>

  <!-- Eyebrows -->
  <path d="M202 218 Q213 210 235 215" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M277 215 Q299 210 310 218" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="200" cy="268" rx="20" ry="9" fill="#fca5a5" opacity="0.35"/>
  <ellipse cx="312" cy="268" rx="20" ry="9" fill="#fca5a5" opacity="0.35"/>

  <!-- Nose -->
  <path d="M254 258 Q256 262 258 258" fill="none" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mouth (cute smile) -->
